<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <!-- Font Awesome cdn css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Ant Design Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@ant-design/icons@4.7.0/lib/bundle.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>To Do List</title>
</head>
<body>
    <header>
        <h1>To Do List</h1>
    </header>
    <form action="">
        <input type="text" class="todo-input" placeholder="Nhập công việc" />
        <!-- Thêm input datetime -->
        <input type="datetime-local" class="todo-datetime" />
        <button class="todo-button" type="submit">
            <i class="fas fa-plus-circle fa-lg"></i>
        </button>
        <div class="select">
            <select name="todos" class="filter-todo">
                <option value="all">Tất cả</option>
                <option value="completed">Đã hoàn thành</option>
                <option value="incomplete">Cần làm</option>
            </select>
        </div>
    </form>

    <!-- Thanh tiến độ -->
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-text">
      ĐÃ HOÀN THÀNH: <span id="progress-count">0</span> / <span id="total-count">0</span>
    </p>

    <div class="todo-container">
        <ul class="todo-list"></ul>
    </div>

    <!-- STREAK SECTION -->
    <div class="streak-section">
        <h2>Streak Tracker</h2>
        
        <!-- Add Topic Button -->
        <div class="streak-controls">
            <button class="add-topic-btn" id="addTopicBtn">
                <i class="fas fa-plus-circle"></i> Thêm chủ đề
            </button>
        </div>

        <!-- Topics Container -->
        <div class="topics-container" id="topicsContainer"></div>
    </div>

    <!-- Modal thêm chủ đề -->
    <div id="topicModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Tạo chủ đề mới</h3>
            <input type="text" id="topicNameInput" placeholder="Nhập tên chủ đề" />
            <button id="saveTopicBtn" class="btn-save">Lưu</button>
        </div>
    </div>

    <!-- Modal xem chi tiết chủ đề -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-detail">
            <span class="close close-detail">&times;</span>
            <h3 id="detailTopicTitle"></h3>
            
            <div class="detail-stats">
                <div class="stat-box">
                    <div class="stat-label">Tháng này</div>
                    <div class="stat-value" id="currentMonthStreak">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Tháng trước</div>
                    <div class="stat-value" id="previousMonthStreak">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Tổng cộng</div>
                    <div class="stat-value" id="totalStreakValue">0</div>
                </div>
            </div>

            <!-- Calendar Section -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" id="prevMonthBtn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h4 id="calendarTitle"></h4>
                    <button class="calendar-nav-btn" id="nextMonthBtn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="detail-section">
                <h4> Chi tiết streaks:</h4>
                <div id="streaksList" class="streaks-list"></div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
    <script src="streak.js"></script>
</body>
</html>
